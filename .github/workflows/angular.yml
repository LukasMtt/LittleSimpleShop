name: angular

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        working-directory: ./frontend/app
      - name: Setup Node.js $
        uses: actions/setup-node@v3
        with:
          node-version: $
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
