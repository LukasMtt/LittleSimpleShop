name: angular

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./frontend/app
        run: npm ci
      - name: Build
        working-directory: ./frontend/app
        run: npm run build
