<div class="miniature-strip-carousel">
    <img [src]=createImage() class="product-miniature-image" alt="miniature image"/>
    <img [src]=createImage() class="product-miniature-image" alt="miniature image"/>
    <img [src]=createImage() class="product-miniature-image" alt="miniature image"/>
    <img [src]=createImage() class="product-miniature-image" alt="miniature image"/>
    <img [src]=createImage() class="product-miniature-image" alt="miniature image"/>
    <img [src]=createImage() class="product-miniature-image" alt="miniature image"/>
</div>

<div class="main-product-image">
    <app-carousel [images]="getImages()"></app-carousel>
</div>

<div class="button-group">
    <button class="shop-button" (click)="addProductToCart()">Add to Cart</button>
    <button class="shop-button">Share</button>
</div>

<div class="product-description">
    <div class="product-description-header">
        <div class="sub-item">
            {{ product?.name?.toUpperCase() }}
        </div>
        <div class="sub-item">
            &middot;
        </div>
        <div class="sub-item">
            {{ getPrice(product) | currency }}
        </div>
    </div>
    <div class="product-description-text">
        {{ product?.description }}
    </div>
</div>
