        <app-sidebar-item class="cart-sidebar-item">
            <app-cart-item [cartItem]="cartItem"></app-cart-item>
        </app-sidebar-item>
    }

    <div class="full-cart-text">
        ...go to full <a [routerLink]='"cart"'>cart</a>...
    </div>
</app-sidebar>
