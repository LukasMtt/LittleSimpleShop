<button
  [type]="type"
  [style.border]="border"
  [style.border-color]="'var(--secondary-color)'"
  [style.border-width]="'0.5px'"
  [disabled]="disabled"
>
  @if (matIcon) {
    <mat-icon class="button-icon">{{ matIcon }}</mat-icon>
  }
  <span class="{{ labelClass }}">{{ label }}</span>
</button>
