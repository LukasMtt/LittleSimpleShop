@for (cardModel of cardModelList; track cardModel.id) {
  <app-card
    [routerLink]="cardModel.cardLink ?? ''"
    [cardModel]="cardModel"
    [style]="{
      'grid-row-start': cardModel.gridRowStartEnd
        ? cardModel.gridRowStartEnd[0]
        : '',
      'grid-row-end': cardModel.gridRowStartEnd
        ? cardModel.gridRowStartEnd[1]
        : ''
    }"
  >
    <div class="sub-text-card">
      @if (templateType == templateTypeEnum.NameOnly) {
        <div class="item-sub-text-card name-only">
          {{ cardModel.name }}
        </div>
      }
      @if (templateType == templateTypeEnum.NameAndPrice) {
        <div class="item-sub-text-card name-and-price">
          {{ cardModel.name }}
        </div>
        <div class="item-sub-text-card name-and-price">&middot;</div>
        <div class="item-sub-text-card name-and-price">
          {{ getPrice(cardModel) | currency }}
        </div>
      }
    </div>
  </app-card>
}
