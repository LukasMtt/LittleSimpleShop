<app-sidebar>
  @for (cartItem of getCartItemsForDisplay(); track cartItem) {
  <app-cart-item [cartItem]="cartItem"></app-cart-item>
  }

  <button
    type="submit"
    class="flex-item-30 go-to-cart-button"
    matTooltip="{{ this.res('TO_FULL_CART') }}"
    [routerLink]="'cart'"
    (click)="onClickCartRoute()"
  >
    {{ this.res('TO_FULL_CART') }}
  </button>
</app-sidebar>
