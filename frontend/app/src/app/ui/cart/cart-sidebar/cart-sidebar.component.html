@for (cartItem of getCartItemsForDisplay(); track cartItem) {
<app-cart-item [cartItem]="cartItem"></app-cart-item>
<hr class="cart-item-divider" />
}

<app-button
  type="submit"
  class="go-to-cart-button"
  matIcon="shopping_cart"
  [label]="this.res('TO_FULL_CART')"
  [routerLink]="'cart'"
  (click)="onClickCartRoute()"
></app-button>
