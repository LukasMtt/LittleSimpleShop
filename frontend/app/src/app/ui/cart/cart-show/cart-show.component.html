@for (id of getCartItemProductIdsForDisplay(); track id) {
  <div class="cart-show-item">
    <app-cart-sidebar-item
      [cartItemProductId]="id"
      previewPictureSize="medium"
    ></app-cart-sidebar-item>
  </div>

  <hr class="cart-show-divider" />
}
<app-cart-sum [cart]="cart()"></app-cart-sum>
