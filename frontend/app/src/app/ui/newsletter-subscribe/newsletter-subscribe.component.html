<div class="subscribe-container">
  <div class="subscribe-text subscribe-item">
    {{ this.res('NEWSLETTER_SUBSCRIBE_TEXT') }}
  </div>
  <div class="subscribe-item">
    <form
      [formGroup]="newsletterSubscribeFormGroup"
      class="newsletter-subscribe-form"
      (ngSubmit)="onSubmit()"
    >
      <app-form-section
        [control]="newsletterSubscribeFormGroup.controls.email"
        [labelResource]="'FORM_ROW_LABEL_EMAIL'"
        [validationFailResourcesMap]="[
          { key: 'email', value: 'VALIDATION_NON_VALID_EMAIL' }
        ]"
        [type]="'email'"
        [id]="'email'"
      ></app-form-section>
      <app-button
        [type]="'submit'"
        [disabled]="false"
        [matIcon]="'email'"
        [label]="this.res('NEWSLETTER_SUBSCRIBE_BUTTON_TEXT')"
        [border]="'solid'"
        class="subscribe-button"
      >
      </app-button>
    </form>
  </div>
</div>
