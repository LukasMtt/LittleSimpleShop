<app-card-board [columnCount]="4" [cardInputList]="cardInputList">
</app-card-board>

<mat-paginator
  class="product-paginator"
  #paginator
  [length]="getTotalDataLength()"
  [pageSize]="pageSize"
  [pageIndex]="pageOffset"
  [hidePageSize]="true"
  (page)="onPageChange($event)"
>
</mat-paginator>
