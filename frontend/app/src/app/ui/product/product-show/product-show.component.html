<div class="col-1">
  <div class="product-description">
    <div class="product-description-header">
      <div class="sub-item product-name">
        {{ product?.name?.toUpperCase() }}
      </div>
      <div class="sub-item">{{ midDotString }}</div>
      <div class="sub-item">
        {{ getPrice(product) | currency }}
      </div>
    </div>
    <div class="badges">
      <span>free shipping - </span>
      <span>in stock - </span>
      <span>lieferbar - estimated delivery</span>
    </div>
    <div class="main-highlihts">
      <ul>
        <li>Bla</li>
        <li>Bli</li>
        <li>Blub</li>
      </ul>
    </div>
    <div class="product-description-text">
      {{ product?.description }}
    </div>
  </div>
</div>

<div class="col-2">
  <div class="main-product-image">
    <app-carousel
      [imagesInput]="carouselImages"
      class="product-carousel"
    ></app-carousel>
  </div>

  <div class="button-group">
    <button class="shop-button" (click)="addProductToCart()">
      Add to Cart
    </button>
    <button class="shop-button">Go to cart</button>
  </div>
  <div>secure checkout - 30 day returns</div>
</div>
