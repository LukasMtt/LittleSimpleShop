<header>
  <app-news-header></app-news-header>
  <mat-toolbar class="header-toolbar">
    <button mat-icon-button (click)="onMenuButtonClick()" class="mat-icon-wrap">
      <mat-icon>menu</mat-icon>
    </button>
    <span></span>
    <span class="header-banner" routerLink="shop">{{
      this.res('SITE_TITLE')
    }}</span>
    <span></span>
    <a [routerLink]="'cart'" class="shopping-basket-button-link">
      <button mat-icon-button class="mat-icon-wrap">
        <mat-icon>shopping_basket</mat-icon>
        <span class="counter-badge">{{ getCartSize() }}</span>
      </button>
    </a>
    <button
      mat-icon-button
      (click)="onCartButtonClick()"
      class="mat-icon-wrap shopping-basket-sidebar-button"
    >
      <mat-icon>shopping_basket</mat-icon>
      <span class="counter-badge">{{ getCartSize() }}</span>
    </button>
  </mat-toolbar>
  <app-header-sidebar [isHidden]="!showSideMenu" />
  <app-cart-sidebar [isHidden]="!showCartMenu" />
</header>
