<div class="carousel-container">
    <mat-icon class="arrow arrow-left" (click)="nextImage(true)">chevron_left</mat-icon>
    <img [src]=createImage(selectedImage) class="selected-image" alt="selected image"/>
    <mat-icon class="arrow arrow-right" (click)="nextImage(false)">chevron_right</mat-icon>
</div>
