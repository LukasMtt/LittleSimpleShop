services:
  seaweedfs:
    container_name: shop_seaweedfs
    hostname: shop_seaweedfs
    image: chrislusf/seaweedfs:4.17
    # ports:
    #   - 8333:8333
    #   - 9333:9333
    #   - 8080:8080
    volumes:
      - shop_seaweedfsvolume:/data
    command:
      - "server -s3 -dir=/data"
  gotenberg:
    container_name: shop_gotenberg
    hostname: shop_gotenberg
    image: gotenberg/gotenberg:8
  sql-server:
    container_name: shop_sqlserver
    hostname: shop_sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    # ports:
    #   - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    volumes:
      - shop_sqlservervolume:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123! -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s
  api:
    container_name: shop_api
    hostname: shop_api
    image: shop-api
    ports:
      - "443:443"
    environment:
      - ASPNETCORE_URLS=https://+;http://+
      # - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    depends_on:
      sql-server:
        condition: service_healthy
        restart: true
      gotenberg:
        condition: service_started
      seaweedfs:
        condition: service_started
    volumes:
      - ${SHOP_API_PATH_TO_HTTPS}:/https/
  ng-app:
    container_name: shop_ng_app
    hostname: shop_ng_app
    image: shop-ng-app
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
volumes:
  shop_sqlservervolume:
    name: shop_sqlservervolume
  shop_seaweedfsvolume:
    name: shop_seaweedfsvolume
  shop_papercutmessagesvolume:
    name: shop_papercutmessagesvolume
  shop_papercutlogsvolume:
    name: shop_papercutlogsvolume
networks:
  default:
    name: shop_network
